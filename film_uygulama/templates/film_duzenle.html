{% extends "base.html" %}

{% block title %}Film Düzenle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h3><i class="fas fa-edit"></i> Film Düzenle</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="baslik" class="form-label">Film Başlığı *</label>
                        <input type="text" class="form-control" id="baslik" name="baslik" 
                               value="{{ film.baslik }}" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="yonetmen" class="form-label">Yönetmen</label>
                            <input type="text" class="form-control" id="yonetmen" name="yonetmen" 
                                   value="{{ film.yonetmen }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="yil" class="form-label">Yıl</label>
                            <input type="number" class="form-control" id="yil" name="yil" 
                                   min="1900" max="2030" value="{{ film.yil }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tur" class="form-label">Tür</label>
                            <select class="form-control" id="tur" name="tur">
                                <option value="">Seçiniz...</option>
                                <option value="Aksiyon" {% if film.tur == "Aksiyon" %}selected{% endif %}>Aksiyon</option>
                                <option value="Komedi" {% if film.tur == "Komedi" %}selected{% endif %}>Komedi</option>
                                <option value="Drama" {% if film.tur == "Drama" %}selected{% endif %}>Drama</option>
                                <option value="Korku" {% if film.tur == "Korku" %}selected{% endif %}>Korku</option>
                                <option value="Bilim Kurgu" {% if film.tur == "Bilim Kurgu" %}selected{% endif %}>Bilim Kurgu</option>
                                <option value="Romantik" {% if film.tur == "Romantik" %}selected{% endif %}>Romantik</option>
                                <option value="Animasyon" {% if film.tur == "Animasyon" %}selected{% endif %}>Animasyon</option>
                                <option value="Gerilim" {% if film.tur == "Gerilim" %}selected{% endif %}>Gerilim</option>
                                <option value="Macera" {% if film.tur == "Macera" %}selected{% endif %}>Macera</option>
                                <option value="Belgesel" {% if film.tur == "Belgesel" %}selected{% endif %}>Belgesel</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="puan" class="form-label">Puan (0-10)</label>
                            <input type="number" class="form-control" id="puan" name="puan" 
                                   min="0" max="10" step="0.1" value="{{ film.puan }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="notlar" class="form-label">Notlar</label>
                        <textarea class="form-control" id="notlar" name="notlar" rows="3">{{ film.notlar }}</textarea>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="izlendi" name="izlendi" 
                               {% if film.izlendi %}checked{% endif %}>
                        <label class="form-check-label" for="izlendi">
                            Bu filmi izledim
                        </label>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning btn-lg">
                            <i class="fas fa-save"></i> Değişiklikleri Kaydet
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> İptal
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
